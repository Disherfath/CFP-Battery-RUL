[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfp-battery-rul"
version = "1.0.0"
description = "Cell-level feature-preserving imputation for battery remaining useful life prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "torch>=2.1,<3", "threadpoolctl>=3,<4",
  "pyyaml>=6,<7", "einops>=0.7,<1", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
